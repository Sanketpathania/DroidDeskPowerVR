name: Build DroidDesk PowerVR APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Pixel 10 Pro XL PowerVR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android NDK (28.2.13676358)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
          link-to-sdk: true

      - name: Accept Android SDK Licenses & Verify NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" || true

      - name: Fetch Native wlroots Dependencies
        run: |
          chmod +x ./fetch_deps.sh
          ./fetch_deps.sh || true

      - name: Ensure Termux Bootstrap Asset
        run: |
          mkdir -p app/assets
          if [ ! -f "app/assets/bootstrap-aarch64.zip" ] || [ ! -s "app/assets/bootstrap-aarch64.zip" ]; then
            echo "Downloading bootstrap-aarch64.zip asset..."
            curl -L --retry 3 "https://github.com/termux/termux-packages/releases/download/bootstrap-2026.09.13-r1%2Bapt.android-7/bootstrap-aarch64.zip" -o "app/assets/bootstrap-aarch64.zip"
          fi
          ls -lh app/assets/bootstrap-aarch64.zip

      - name: Ensure Stable Release Keystore
        run: |
          mkdir -p app/android/app
          if [ ! -f "app/android/app/release.keystore" ]; then
            echo "Generating stable release keystore..."
            openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 10000 -nodes -subj "/CN=DroidDesk/O=DroidDesk/C=US"
            openssl pkcs12 -export -out app/android/app/release.keystore -inkey /tmp/key.pem -in /tmp/cert.pem -name droiddesk -password pass:droiddesk_release_password
          fi
          ls -la app/android/app/release.keystore

      - name: Resolve Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release --build-name=0.1.0 --build-number=${{ github.run_number }} --android-skip-build-dependency-validation
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Pixel10-PowerVR-Release-APK
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
