name: Build DroidDesk PowerVR APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Pixel 10 Pro XL PowerVR)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fetch Native wlroots Dependencies
        run: |
          chmod +x ./fetch_deps.sh
          ./fetch_deps.sh || true

      - name: Resolve Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidDesk-Pixel10-PowerVR-Release-APK
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
